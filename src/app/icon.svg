<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!-- Dynamic Favicon for Maria Isabel Lisita -->
  <style>
    :root { color: #1C1B18; }
    @media (prefers-color-scheme: dark) { :root { color: #EDE7DA; } }
  </style>
  <g fill="currentColor" shape-rendering="crispEdges">
    <!-- Compact ml mark for 32x32px favicon -->
    <rect x="3" y="14" width="2" height="10" />
    <rect x="5" y="12" width="4" height="2" />
    <rect x="9" y="14" width="2" height="10" />
    <rect x="11" y="12" width="4" height="2" />
    <rect x="15" y="14" width="2" height="10" />
    
    <!-- Subida ao L -->
    <rect x="17" y="18" width="2" height="2" />
    <rect x="19" y="12" width="2" height="6" />
    <rect x="21" y="4" width="2" height="8" />
    <rect x="23" y="2" width="3" height="2" />
    <rect x="25" y="4" width="2" height="4" />
    <rect x="23" y="8" width="2" height="12" />
    <rect x="21" y="20" width="2" height="4" />
    <rect x="23" y="24" width="5" height="2" />
  </g>
  <!-- Sparkle em Rosa Choque (#FF2A85) -->
  <g fill="#FF2A85" shape-rendering="crispEdges">
    <rect x="27" y="10" width="2" height="6" />
    <rect x="25" y="12" width="6" height="2" />
    <rect x="27" y="12" width="2" height="2" fill="#FFFFFF" />
  </g>
</svg>
